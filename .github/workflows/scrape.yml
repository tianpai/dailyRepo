name: Daily Repo Scrape

on:
  schedule:
    - cron: "20 15 * * *"
  workflow_dispatch:

concurrency:
  group: daily-repo-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check scraper database configuration
        env:
          SCRAPER_MONGODB_URI: ${{ secrets.SCRAPER_MONGODB_URI }}
        run: |
          if [ -z "$SCRAPER_MONGODB_URI" ]; then
            echo "::error::Set SCRAPER_MONGODB_URI to the new database before running this scraper."
            exit 1
          fi

      - name: Get runner public IP
        id: get_ip
        run: |
          IP=$(curl -s https://ipinfo.io/ip)
          echo "Runner public IP: $IP"
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Add IP to Atlas allowlist
        run: |
          curl --fail-with-body -X POST \
            --digest \
            -u "${{ secrets.ATLAS_PUBLIC_KEY }}:${{ secrets.ATLAS_PRIVATE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '[{"ipAddress": "${{ steps.get_ip.outputs.ip }}", "comment": "GitHub Actions runner"}]' \
            "https://cloud.mongodb.com/api/atlas/v1.0/groups/${{ secrets.ATLAS_PROJECT_ID }}/accessList"
          echo "Waiting for Atlas to propagate IP allowlist..."
          sleep 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build scraper
        run: pnpm --filter @dailyrepo/scraper... build

      - name: Run scraper
        run: pnpm --filter @dailyrepo/scraper scrape:batched
        env:
          SCRAPER_MONGODB_URI: ${{ secrets.SCRAPER_MONGODB_URI }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Remove IP from Atlas allowlist
        if: always() && steps.get_ip.outputs.ip != ''
        run: |
          curl --fail-with-body -X DELETE \
            --digest \
            -u "${{ secrets.ATLAS_PUBLIC_KEY }}:${{ secrets.ATLAS_PRIVATE_KEY }}" \
            -H "Accept: application/json" \
            "https://cloud.mongodb.com/api/atlas/v1.0/groups/${{ secrets.ATLAS_PROJECT_ID }}/accessList/${{ steps.get_ip.outputs.ip }}%2F32"
          echo "IP removed from Atlas allowlist"
